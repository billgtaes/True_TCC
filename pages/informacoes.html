<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações Adicionais</title>
    <link rel="stylesheet" href="../assets/css/informacoes.css">
</head>
<body>
    <div class="container">
        <h1>Informações Adicionais</h1>
        
        <form id="infoForm">
            <!-- Campo 1: Ocupação -->
            <div class="form-group">
                <label for="ocupacao">Ocupação:</label>
                <input type="text" id="ocupacao" name="ocupacao" placeholder="Sua ocupação" required>
            </div>
            
            <!-- Campo 2: Instituição -->
            <div class="form-group">
                <label for="instituicao">Instituição:</label>
                <input type="text" id="instituicao" name="instituicao" placeholder="Nome da instituição" required>
            </div>
            
            <!-- Campo 3: Data de Nascimento -->
            <div class="form-group">
                <label for="dataNascimento">Data de nascimento:</label>
                <input type="date" id="dataNascimento" name="dataNascimento" required>
            </div>
            
            <!-- Campo 4: Horário de Trabalho -->
            <div class="form-group">
                <label for="horarioTrabalho">Horário de trabalho:</label>
                <input type="time" id="horarioTrabalho" name="horarioTrabalho" required>
            </div>
            
            <!-- Campo 5: Formação -->
            <div class="form-group">
                <label for="formacao">Formação:</label>
                <textarea id="formacao" name="formacao" placeholder="Sua formação" required></textarea>
            </div>
            
            <!-- Seção de Foto -->
            <div class="photo-section">
                <label for="foto">Adicionar Foto:</label>
                <input type="file" id="foto" name="foto" accept="image/*" style="display: none;">
                <button type="button" onclick="document.getElementById('foto').click()" class="btn-submit">
                    Selecionar Foto
                </button>
                <img id="photoPreview" alt="Prévia da foto">
            </div>
            
            <!-- Botões -->
            <div class="button-group">
                <button type="submit" class="btn-submit">Enviar</button>
                <button type="reset" class="btn-cancel" onclick="irParaDescricao()">Pular</button>
            </div>
        </form>
    </div>
    
    <script>
        document.getElementById('foto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('photoPreview').src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
        function irParaDescricao () {
            window.location.href = './descricao.html';
        }
        document.getElementById('infoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Informações enviadas com sucesso!');
            // Aqui você pode enviar os dados para um servidor
        });
    </script>
</body>
</html>
